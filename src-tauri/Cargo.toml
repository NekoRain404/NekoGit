[package]
name = "nekogit-client"
version = "0.1.0"
description = "NekoGit Linux desktop client"
authors = ["NekoGit contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "nekogit_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
getrandom = "0.3.4"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.11.2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2.4.1"
tauri-plugin-fs = "2.4.3"
tauri-plugin-notification = "2.3.3"
